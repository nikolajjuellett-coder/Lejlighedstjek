name: Overvåg Kereby boliger

# Hvorfor en "kæde" af kørsler i stedet for et skema?
# GitHubs skemalagte kørsler er "best effort" og blev i praksis kun startet
# 1-2 gange i døgnet i stedet for hvert 5. minut. Derfor kører hver kørsel her
# selv en løkke i op til 5 timer (tjek hvert 5. minut mellem 08 og 17 dansk
# tid) og starter bagefter selv den næste kørsel. Skemaet nedenfor er kun et
# sikkerhedsnet, der genstarter kæden, hvis den skulle gå i stå.
#
# KRÆVER et offentligt (public) repo: kørslen er i gang hele døgnet, og et
# privat repo ville bruge sin gratis kvote på få dage.

on:
  schedule:
    - cron: "7 * * * *"   # sikkerhedsnet, hver time (UTC)
  workflow_dispatch: {}   # manuel start: "Run workflow" i Actions-fanen

permissions:
  contents: write   # gem opdateret status i repoet
  actions: write    # start næste kørsel

# Kun én kørsel ad gangen. Ekstra kørsler venter i kø (højst én).
concurrency:
  group: kereby-overvagning
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04      # fastlåst; "ubuntu-latest" skifter til Ubuntu 26
    timeout-minutes: 340       # løkken stopper selv efter 300 min
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Playwright browsere
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Installer afhængigheder
        run: |
          pip install -r requirements.txt
          playwright install chromium
          # Systembiblioteker er normalt allerede installeret. Hvis Ubuntus
          # servere ikke kan nås, må det ikke vælte hele kørslen.
          timeout 120 playwright install-deps chromium || echo "install-deps fejlede - fortsætter alligevel"

      - name: Overvåg Kereby (løbende)
        id: loop
        env:
          PYTHONUNBUFFERED: "1"
          MAX_RUN_MIN: "300"
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python check_kereby.py

      - name: Gem opdateret status i repoet
        if: always()
        run: |
          git config user.name "kereby-overvaagning"
          git config user.email "actions@github.com"
          git add seen_listings.json
          git diff --cached --quiet || git commit -m "Opdater liste over sete boliger"
          git push || echo "push fejlede - status gemmes ved næste ændring"

      - name: Start næste kørsel
        if: always() && steps.loop.outputs.genstart == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run check-kereby.yml --ref "${{ github.ref_name }}"
