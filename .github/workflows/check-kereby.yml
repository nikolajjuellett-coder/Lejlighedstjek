name: Overvåg Kereby boliger

on:
  schedule:
    # Kører hvert 10. minut, hele døgnet i UTC. Selve begrænsningen til
    # 08-17 dansk tid sker i "Tjek tidsvindue"-trinnet nedenfor, så det er
    # korrekt både ved sommertid og vintertid.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}   # gør det muligt at trigge manuelt fra Actions-fanen

permissions:
  contents: write   # nødvendigt for at scriptet kan gemme opdateret status

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tjek tidsvindue (08-17 dansk tid)
        id: tidscheck
        run: |
          RESULT=$(python3 -c "
          import datetime, zoneinfo
          now = datetime.datetime.now(zoneinfo.ZoneInfo('Europe/Copenhagen'))
          print('true' if 8 <= now.hour < 17 else 'false')
          ")
          echo "Dansk lokaltid nu: $(TZ=Europe/Copenhagen date)"
          echo "inden_for_vindue=$RESULT" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.tidscheck.outputs.inden_for_vindue == 'true'
        with:
          python-version: "3.11"

      - name: Cache Playwright browsere
        if: steps.tidscheck.outputs.inden_for_vindue == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Installer afhængigheder
        if: steps.tidscheck.outputs.inden_for_vindue == 'true'
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Kør tjek af Kereby
        if: steps.tidscheck.outputs.inden_for_vindue == 'true'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python check_kereby.py

      - name: Gem opdateret status i repoet
        if: steps.tidscheck.outputs.inden_for_vindue == 'true'
        run: |
          git config user.name "kereby-overvaagning"
          git config user.email "actions@github.com"
          git add seen_listings.json
          git diff --cached --quiet || git commit -m "Opdater liste over sete boliger"
          git push
